[project]
name = "inject-scout"
version = "0.1.0"
description = "On-device prompt injection & jailbreak scanner for LLM apps: deterministic rule engine, 24-attack fixture corpus, JSON/markdown reports, zero API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pxlcrtiv" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "ai-safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.scripts]
inject-scout = "inject_scout.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inject_scout*"]

[tool.setuptools.package-data]
"inject_scout.data" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"